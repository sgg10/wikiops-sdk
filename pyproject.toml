[project]
name = "wikiops-sdk"
version = "1.0.0"
description = "Public SDK for WikiOps plugins and integrations. Provides the shared contracts, domain models, compatibility rules, and extension interfaces needed to build providers and documentation plugins."
authors = [
    {name = "Sebastian Granda Gallego",email = "sgg10.develop@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
tests = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=6.2.1,<7.0.0)"
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra --cov=wikiops_sdk --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["wikiops_sdk"]

[tool.coverage.report]
show_missing = true
skip_covered = false
