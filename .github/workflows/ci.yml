name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install project dependencies
        run: poetry install --with tests --no-interaction

      - name: Run test suite
        run: poetry run pytest

  build-check:
    name: Build and packaging checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade pip poetry twine

      - name: Validate project metadata
        run: poetry check

      - name: Build distributions
        run: poetry build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke test built wheel
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python scripts/smoke_test_sdk.py --expected-distribution-version "$(poetry version -s)"
